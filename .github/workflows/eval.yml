name: RAGAS Eval

# PRs get a small RAGAS-scored sample for fast, cheap feedback. Pushes to
# main and the weekly schedule run the full 101-item golden set — that's
# the authoritative gate. See eval/README.md "Baseline run and threshold
# rationale" for why --threshold defaults to 0.75 against an observed 0.82
# baseline, and "Known limitations" for what a failing run might mean.
#
# Two gates, both must pass: --threshold (aggregate RAGAS score) and
# --min-avg-citations (average citations/answer). The second one exists
# because faithfulness alone doesn't catch a starved-retrieval regression —
# see eval/README.md "Citation-count baseline and --min-avg-citations
# rationale" for the incident that surfaced this and how 2.5 was derived.
# Reused across sample sizes rather than tuned per trigger, same precedent
# as --threshold: the PR-trigger's 15-item sample gets more variance on
# both gates than the full 101-item run, accepted here the same way it's
# already accepted for --threshold, in exchange for fast/cheap PR feedback
# — the full run on push/schedule remains the authoritative gate.
#
# Required repository secrets:
#   DEEPSEEK_API_KEY   - pipeline generation + RAGAS judge LLM
#   GEMINI_API_KEY     - default embedding provider (both ingestion and
#                        RAGAS answer_correctness's local embeddings model
#                        download separately and need no key)
#   PINECONE_API_KEY   - vector store (auto-creates its index if missing)
# Optional repository variable:
#   PINECONE_INDEX_NAME - defaults to "rag-pipeline-index" if unset
#
# Gemini's free tier is 1000 embedding requests/day, shared across every
# workflow run *and* any local dev usage on the same key — a burst of PRs
# can exhaust it (this happened once during manual testing; see
# eval/README.md). Keep --sample-size modest on the pull_request trigger
# for that reason, not just cost.

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      sample-size:
        description: "Sample size (blank = full 101-item run)"
        required: false
        default: ""

concurrency:
  group: ragas-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      # `|| 'rag-pipeline-index'` matters: an unset repo variable still
      # defines this env var as an empty string (not absent), which
      # defeats VectorStore's own os.getenv(..., "rag-pipeline-index")
      # fallback — os.getenv only falls back when the key is missing
      # entirely, not when it's present-but-empty. Learned this the hard
      # way: an early run crashed in pinecone-client with "Invalid value
      # for `name`, length must be >= 1" because of exactly this.
      PINECONE_INDEX_NAME: ${{ vars.PINECONE_INDEX_NAME || 'rag-pipeline-index' }}
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # unstructured's pptx parsing needs libmagic; ships as a Linux system
      # package here (unlike Windows, which needs the separate
      # python-magic-bin wheel — see eval/README.md "Known limitations" /
      # requirements.txt comments for that story).
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # punkt (not just punkt_tab) is required: src/ingestion/chunker.py
      # checks specifically for the old resource name at import time. Also
      # fixed chunker.py itself to fall back gracefully instead of crashing
      # if this is ever missing again — this download is belt-and-suspenders
      # so CI gets real NLTK sentence splitting, not the regex fallback.
      - name: Download NLTK data
        run: python -m nltk.downloader punkt punkt_tab averaged_perceptron_tagger averaged_perceptron_tagger_eng

      - name: Run RAGAS eval (pull request — sampled)
        if: github.event_name == 'pull_request'
        run: python -m eval.run_ragas_eval --sample-size 15 --threshold 0.75 --min-avg-citations 2.5

      - name: Run RAGAS eval (push/schedule — full set)
        if: github.event_name != 'pull_request' && github.event_name != 'workflow_dispatch'
        run: python -m eval.run_ragas_eval --threshold 0.75 --min-avg-citations 2.5

      - name: Run RAGAS eval (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        # Bracket notation, not dot notation, for the hyphenated input name
        # — `inputs.sample-size` risks being parsed as subtraction by the
        # GitHub Actions expression evaluator.
        env:
          SAMPLE_SIZE_INPUT: ${{ github.event.inputs['sample-size'] }}
        run: |
          if [ -n "$SAMPLE_SIZE_INPUT" ]; then
            python -m eval.run_ragas_eval --threshold 0.75 --min-avg-citations 2.5 --sample-size "$SAMPLE_SIZE_INPUT"
          else
            python -m eval.run_ragas_eval --threshold 0.75 --min-avg-citations 2.5
          fi

      - name: Add summary to job log
        if: always()
        run: |
          latest_md=$(ls -t eval/results/*.md 2>/dev/null | head -n 1)
          if [ -n "$latest_md" ]; then
            cat "$latest_md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.run_id }}
          path: eval/results/
          retention-days: 90

      # Posts (or updates, on re-push) a single PR comment with the eval
      # summary — the same markdown already going into GITHUB_STEP_SUMMARY,
      # just surfaced where a reviewer doesn't have to click into Actions to
      # see it. Matched by a hidden marker comment so re-runs on the same PR
      # edit one comment instead of piling up a new one per push.
      - name: Comment on PR with eval results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const resultsDir = 'eval/results';
            const files = fs.readdirSync(resultsDir).filter(f => f.endsWith('.md'));
            if (files.length === 0) return;
            const latest = files.sort().reverse()[0];
            const body = fs.readFileSync(path.join(resultsDir, latest), 'utf-8');
            const marker = '<!-- ragas-eval-comment -->';
            const comment = `${marker}\n${body}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }
